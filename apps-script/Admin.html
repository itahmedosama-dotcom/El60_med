<!doctype html><html lang="ar" dir="rtl"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--n:#103b63;--r:#ef3340;--l:#dce4ec}*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;margin:0;background:#f4f7fa;color:#182838}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:white;border:1px solid var(--l);border-radius:20px;padding:22px;margin-bottom:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.btn{border:0;border-radius:10px;background:var(--r);color:#fff;padding:10px 16px;font-weight:700;cursor:pointer}.btn.alt{background:var(--n)}input,textarea{width:100%;border:1px solid var(--l);padding:10px;border-radius:10px}label{display:grid;gap:6px;margin:9px 0;font-weight:700;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{border-top:1px solid var(--l);padding:14px 0}.hidden{display:none}.status{font-size:13px;color:#48657b}.danger{background:#8b2330}.login{max-width:430px;margin:90px auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#fff;border:1px solid var(--l);color:var(--n);padding:9px 13px;border-radius:10px;cursor:pointer}.tab.on{background:var(--n);color:white}.muted{color:#6c7987;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="login" class="wrap login"><div class="card"><h2>إدارة موقع أطباء الستين</h2><label>اسم المستخدم<input id="u" value="admin"></label><label>كلمة المرور<input id="p" type="password"></label><button class="btn" onclick="login()">دخول</button><p class="muted">كلمة المرور الافتراضية بعد الإعداد: ChangeMe123! ويجب تغييرها مباشرة من ورقة Users.</p></div></div><div id="app" class="wrap hidden"><div class="top"><div><h1>لوحة إدارة المحتوى</h1><div class="status" id="status">جاهز</div></div><div><button class="btn alt" onclick="reloadData()">تحديث</button> <button class="btn" onclick="save()">حفظ التعديلات</button></div></div><div class="tabs"><button class="tab on" data-tab="site">بيانات الموقع</button><button class="tab" data-tab="departments">الأقسام</button><button class="tab" data-tab="devices">الأجهزة</button><button class="tab" data-tab="insurance">التأمين</button><button class="tab" data-tab="values">القيم</button><button class="tab" data-tab="partners">سابقة الأعمال والموردون</button></div><div id="editor"></div></div><script>let token='',data={},tab='site';function post(obj){return fetch(location.href,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams(obj)}).then(r=>r.json())}async function login(){const r=await post({action:'login',username:u.value,password:p.value});if(r.ok){token=r.ok;loginEl().classList.add('hidden');app.classList.remove('hidden');reloadData()}else alert('بيانات الدخول غير صحيحة')}function loginEl(){return document.getElementById('login')}async function reloadData(){setStatus('جاري التحميل...');const r=await fetch(location.href.replace(/\?.*$/,'')+'?action=publicData&_='+Date.now()).then(r=>r.json());data=r.data||{};render();setStatus('تم التحميل')}function setStatus(s){document.getElementById('status').textContent=s}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;render()});function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function render(){const e=document.getElementById('editor');if(tab==='site'){e.innerHTML=`<div class=card><div class=grid><label>WhatsApp<input data-site=whatsapp value="${esc(data.site?.whatsapp)}"></label><label>العنوان عربي<input data-site=address_ar value="${esc(data.site?.address_ar)}"></label><label>Address EN<input data-site=address_en value="${esc(data.site?.address_en)}"></label><label>رابط Google Maps<input data-site=map_url value="${esc(data.site?.map_url)}"></label><label>رابط Embed للخريطة<input data-site=map_embed value="${esc(data.site?.map_embed)}"></label></div></div>`;return}const cfg={departments:['ar','en','desc_ar','desc_en','active'],devices:['name','ar','en','active'],insurance:['name','active'],values:['icon','ar','en','ar_desc','en_desc'],partners:['ar','en','logo','active']}[tab];const labels={ar:'العربي',en:'English',desc_ar:'الوصف العربي',desc_en:'English description',active:'فعال',name:'الاسم',icon:'الرمز',ar_desc:'الوصف العربي',en_desc:'English description',logo:'رابط/مسار الشعار'};e.innerHTML=`<div class=card><button class="btn alt" onclick="addRow()">+ إضافة</button><div id=rows>${(data[tab]||[]).map((o,i)=>rowHtml(o,i,cfg,labels)).join('')}</div></div>`}function rowHtml(o,i,cfg,labels){return `<div class=row data-index=${i}><div class=grid>${cfg.map(k=>{if(k==='active')return `<label>${labels[k]}<select data-k=${k}><option value=true ${String(o[k])!=='false'?'selected':''}>نعم</option><option value=false ${String(o[k])==='false'?'selected':''}>لا</option></select></label>`;if(k.includes('desc'))return `<label>${labels[k]}<textarea data-k=${k}>${esc(o[k])}</textarea></label>`;return `<label>${labels[k]}<input data-k=${k} value="${esc(o[k])}"></label>`}).join('')}</div><button class="btn danger" onclick="delRow(${i})">حذف</button></div>`}function sync(){if(tab==='site'){data.site=data.site||{};document.querySelectorAll('[data-site]').forEach(x=>data.site[x.dataset.site]=x.value);return}document.querySelectorAll('#rows .row').forEach((r,i)=>{const o={};r.querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.value);data[tab][i]=o})}function addRow(){sync();data[tab]=data[tab]||[];data[tab].push({active:'true'});render()}function delRow(i){sync();data[tab].splice(i,1);render()}async function save(){sync();setStatus('جاري الحفظ...');const r=await post({action:'save',token,payload:JSON.stringify(data)});if(r.ok)setStatus('تم الحفظ بنجاح');else setStatus('خطأ: '+(r.error||''))}</script></body></html>
