<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة أطباء الستين</title>
<style>
:root{--brand:#123d63;--brand2:#0b2944;--accent:#ef3340;--bg:#f5f7fa;--card:#fff;--line:#e1e7ed;--text:#172b3a;--muted:#70808d;--green:#19a66a;--shadow:0 14px 35px rgba(17,45,70,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
/* Login */
.login-screen{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f7f9fb 0%,#eef3f7 100%);padding:24px}.login-box{width:min(470px,100%);background:#fff;border-radius:22px;box-shadow:0 24px 70px rgba(13,48,77,.15);padding:36px;border:1px solid #e8edf2}.login-brand{text-align:center;margin-bottom:26px}.login-brand img{width:245px;max-width:82%;height:auto}.login-brand h1{font-size:26px;margin:24px 0 8px;color:var(--brand2)}.login-brand p{margin:0;color:var(--muted);font-size:14px}.field{display:grid;gap:8px;margin:15px 0}.field>span{font-weight:700;font-size:13px}.field input,.field textarea,.field select,.control{width:100%;border:1px solid #d9e1e8;border-radius:10px;padding:12px 13px;background:#fff;color:var(--text);outline:none;transition:.2s}.field input:focus,.field textarea:focus,.field select:focus,.control:focus{border-color:#98b4ca;box-shadow:0 0 0 3px rgba(18,61,99,.08)}.field textarea{min-height:96px;resize:vertical}.captcha-row{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:end}.captcha-code{height:48px;display:flex;align-items:center;justify-content:center;border:1px dashed #a8b7c4;border-radius:10px;background:#f7fafc;font-weight:800;letter-spacing:4px;font-size:18px;color:var(--brand2);user-select:none}.refresh{height:48px;border:1px solid #dce4ea;background:#fff;border-radius:10px;color:var(--brand);font-size:20px}.primary{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:800}.primary:hover{filter:brightness(.96)}.login-btn{width:100%;margin-top:8px;height:48px}.lang-btn{display:block;margin:14px auto 0;border:0;background:transparent;color:var(--brand);font-weight:800}.login-error{min-height:20px;text-align:center;margin-top:12px;color:#b42331;font-size:13px}
/* App */
.app{min-height:100vh;display:grid;grid-template-columns:265px 1fr}.sidebar{background:linear-gradient(180deg,var(--brand2),#081f33);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px}.side-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px;border-bottom:1px solid rgba(255,255,255,.1)}.side-brand img{width:55px;height:55px;object-fit:contain;background:#fff;border-radius:11px;padding:5px}.side-brand strong{display:block;font-size:14px}.side-brand small{color:#aac0d1;font-size:11px}.menu{display:grid;gap:5px;margin-top:20px}.nav-btn,.nav-link{width:100%;border:0;background:transparent;color:#d7e2eb;border-radius:9px;padding:11px 12px;text-align:right;text-decoration:none;display:flex;align-items:center;gap:10px;font-size:13px}.nav-btn:hover,.nav-btn.active,.nav-link:hover{background:rgba(255,255,255,.1);color:#fff}.nav-ico{width:22px;text-align:center;opacity:.9}.side-bottom{margin-top:24px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px}.logout{color:#ffd6d9}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.topbar h1{font-size:20px;margin:0}.top-actions{display:flex;align-items:center;gap:9px}.ghost,.soft,.danger{border:1px solid var(--line);background:#fff;color:var(--brand);border-radius:9px;padding:9px 13px;font-weight:700}.soft{background:#edf4f8;border-color:#edf4f8}.danger{background:#fff2f3;color:#a22b36;border-color:#ffd9dd}.page{padding:28px;max-width:1500px;margin:auto}.kicker{font-size:11px;font-weight:800;letter-spacing:1.6px;color:#8a9aa7;margin-bottom:7px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.section-head h2{margin:0;font-size:22px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stat .n{font-size:30px;font-weight:900;color:var(--brand2);margin-top:8px}.stat .l{color:var(--muted);font-size:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.panel-head h3{margin:0;font-size:17px}.panel-body{padding:20px}.searchbar{display:flex;gap:10px;align-items:center}.searchbar input{min-width:260px;border:1px solid var(--line);border-radius:9px;padding:10px 12px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}.data-table th{background:#f7f9fb;color:#607180;font-size:12px;text-align:right;padding:11px;border-bottom:1px solid var(--line)}.data-table td{padding:12px 11px;border-bottom:1px solid #eef2f5;vertical-align:middle}.data-table tr:last-child td{border-bottom:0}.status-pill{display:inline-flex;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800;background:#eaf8f1;color:#167a50}.status-pill.off{background:#f3f4f5;color:#7b8790}.row-actions{display:flex;gap:6px}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;color:var(--brand);font-weight:700}.mini.red{color:#a22833;background:#fff4f5;border-color:#ffe0e3}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.savebar{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.notice{padding:12px 14px;border-radius:10px;background:#eef6fb;color:#315a78;font-size:13px;margin-bottom:15px}.toast{position:fixed;left:24px;bottom:24px;background:#142d40;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 14px 35px rgba(0,0,0,.2);z-index:30;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:rgba(8,27,43,.52);display:grid;place-items:center;padding:20px;z-index:40}.modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.22)}.modal-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0}.modal-close{border:0;background:#f1f4f6;width:36px;height:36px;border-radius:50%;font-size:20px}.modal-body{padding:20px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.app{grid-template-columns:220px 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:760px){.app{display:block}.sidebar{height:auto;position:relative}.menu{display:flex;overflow:auto}.nav-btn,.nav-link{white-space:nowrap;width:auto}.side-bottom{display:flex;gap:6px}.topbar{padding:0 15px}.page{padding:16px}.cards{grid-template-columns:1fr 1fr}.topbar h1{font-size:16px}.searchbar input{min-width:0;width:100%}.section-head{align-items:flex-start;flex-direction:column}.panel-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-brand">
      <img src="../assets/logo.jpeg" alt="مجمع أطباء الستين">
      <h1 data-ar="دخول لوحة التحكم" data-en="Admin Login">دخول لوحة التحكم</h1>
      <p data-ar="أدخل اسم المستخدم وكلمة المرور لإدارة محتوى الموقع." data-en="Enter your username and password to manage website content.">أدخل اسم المستخدم وكلمة المرور لإدارة محتوى الموقع.</p>
    </div>
    <label class="field"><span data-ar="اسم المستخدم" data-en="Username">اسم المستخدم</span><input id="username" autocomplete="username" value="admin"></label>
    <label class="field"><span data-ar="كلمة المرور" data-en="Password">كلمة المرور</span><input id="password" type="password" autocomplete="current-password"></label>
    <div class="field"><span data-ar="رمز التحقق" data-en="Verification code">رمز التحقق</span><div class="captcha-row"><div id="captchaCode" class="captcha-code"></div><button class="refresh" type="button" onclick="makeCaptcha()">↻</button></div></div>
    <label class="field"><input id="captchaInput" data-ph-ar="اكتب رمز التحقق" data-ph-en="Enter verification code" placeholder="اكتب رمز التحقق"></label>
    <button id="loginBtn" class="primary login-btn" onclick="login()" data-ar="تسجيل الدخول" data-en="Login">تسجيل الدخول</button>
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<div id="adminApp" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand"><img src="../assets/logo.jpeg"><div><strong>مجمع أطباء الستين</strong><small>ADMIN PANEL</small></div></div>
    <nav class="menu">
      <button class="nav-btn active" data-section="dashboard"><span class="nav-ico">▦</span><span data-ar="لوحة التحكم" data-en="Dashboard">لوحة التحكم</span></button>
      <button class="nav-btn" data-section="departments"><span class="nav-ico">✚</span><span data-ar="الأقسام والتخصصات" data-en="Departments">الأقسام والتخصصات</span></button>
      <button class="nav-btn" data-section="devices"><span class="nav-ico">◫</span><span data-ar="الأجهزة الطبية" data-en="Medical Devices">الأجهزة الطبية</span></button>
      <button class="nav-btn" data-section="insurance"><span class="nav-ico">◇</span><span data-ar="شركات التأمين" data-en="Insurance">شركات التأمين</span></button>
      <button class="nav-btn" data-section="partners"><span class="nav-ico">◎</span><span data-ar="سابقة الأعمال والموردون" data-en="Partners & Suppliers">سابقة الأعمال والموردون</span></button>
      <button class="nav-btn" data-section="values"><span class="nav-ico">♥</span><span data-ar="القيم" data-en="Values">القيم</span></button>
      <button class="nav-btn" data-section="site"><span class="nav-ico">⚙</span><span data-ar="إعدادات الموقع" data-en="Site Settings">إعدادات الموقع</span></button>
      <button class="nav-btn" data-section="security"><span class="nav-ico">◉</span><span data-ar="تغيير كلمة المرور" data-en="Change Password">تغيير كلمة المرور</span></button>
    </nav>
    <div class="side-bottom">
      <a class="nav-link" href="../" target="_blank"><span class="nav-ico">↗</span><span data-ar="عرض الموقع" data-en="View Website">عرض الموقع</span></a>
      <button class="nav-btn logout" onclick="logout()"><span class="nav-ico">⇥</span><span data-ar="تسجيل الخروج" data-en="Logout">تسجيل الخروج</span></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="pageTitle">لوحة التحكم</h1><div class="top-actions"><button class="ghost" onclick="reloadData()" data-ar="تحديث البيانات" data-en="Refresh">تحديث البيانات</button><button class="soft" onclick="toggleLang()" id="appLangBtn">English</button></div></header>
    <div class="page" id="pageContent"></div>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" onclick="closeModal()">×</button></div><div id="modalBody" class="modal-body"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbx8EOyyw29rtK2cjyeXhIEParDbwf8baqXohzJfi1GlG9fdWrbEJTY4_8C8R91krwwA7w/exec';
let token='',data={},section='dashboard',lang=localStorage.getItem('adminLang')||'ar',captcha='';
const titles={dashboard:['لوحة التحكم','Dashboard'],departments:['الأقسام والتخصصات','Departments'],devices:['الأجهزة الطبية','Medical Devices'],insurance:['شركات التأمين','Insurance'],partners:['سابقة الأعمال والموردون','Partners & Suppliers'],values:['القيم','Values'],site:['إعدادات الموقع','Site Settings'],security:['تغيير كلمة المرور','Change Password']};
const ar=()=>lang==='ar';
function tr(a,e){return ar()?a:e}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function post(obj){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams(obj)}).then(r=>r.json())}
function makeCaptcha(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';captcha=Array.from({length:5},()=>chars[Math.floor(Math.random()*chars.length)]).join('');captchaCode.textContent=captcha;captchaInput.value=''}
async function login(){loginError.textContent='';if(captchaInput.value.trim().toUpperCase()!==captcha){loginError.textContent=tr('رمز التحقق غير صحيح','Invalid verification code');makeCaptcha();return}loginBtn.disabled=true;loginBtn.textContent=tr('جاري الدخول...','Signing in...');try{const r=await post({action:'login',username:username.value.trim(),password:password.value});if(r.ok){token=r.ok;sessionStorage.setItem('alsiteenAdminToken',token);loginScreen.classList.add('hidden');adminApp.classList.remove('hidden');await reloadData();showSection('dashboard')}else{loginError.textContent=tr('اسم المستخدم أو كلمة المرور غير صحيحة','Invalid username or password');makeCaptcha()}}catch(e){loginError.textContent=tr('تعذر الاتصال بخدمة الإدارة','Could not connect to admin service')}finally{loginBtn.disabled=false;loginBtn.textContent=tr('تسجيل الدخول','Login')}}
function logout(){token='';sessionStorage.removeItem('alsiteenAdminToken');adminApp.classList.add('hidden');loginScreen.classList.remove('hidden');password.value='';makeCaptcha()}
async function reloadData(){toastMsg(tr('جاري تحديث البيانات...','Refreshing data...'));try{const r=await fetch(API_URL+'?action=publicData&_='+Date.now());const j=await r.json();if(!j.ok)throw new Error(j.error||'API error');data=j.data||{};render();toastMsg(tr('تم تحديث البيانات','Data refreshed'))}catch(e){toastMsg(tr('تعذر تحميل البيانات','Could not load data'),true)}}
function toggleLang(){lang=ar()?'en':'ar';localStorage.setItem('adminLang',lang);applyLang();render()}
function applyLang(){document.documentElement.dir=ar()?'rtl':'ltr';document.documentElement.lang=lang;document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=tr(el.dataset.ar,el.dataset.en));document.querySelectorAll('[data-ph-ar]').forEach(el=>el.placeholder=tr(el.dataset.phAr,el.dataset.phEn));langBtn.textContent=ar()?'English':'العربية';appLangBtn.textContent=ar()?'English':'العربية';pageTitle.textContent=titles[section][ar()?0:1]}
function showSection(s){section=s;document.querySelectorAll('.nav-btn[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===s));pageTitle.textContent=titles[s][ar()?0:1];render()}
document.querySelectorAll('.nav-btn[data-section]').forEach(b=>b.onclick=()=>showSection(b.dataset.section));
function toastMsg(msg,err=false){toast.textContent=msg;toast.style.background=err?'#922d38':'#142d40';toast.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>toast.classList.remove('show'),2200)}
function render(){if(adminApp.classList.contains('hidden'))return;applyLang();if(section==='dashboard')return renderDashboard();if(section==='site')return renderSite();if(section==='security')return renderSecurity();renderList(section)}
function renderDashboard(){const counts={departments:(data.departments||[]).length,devices:(data.devices||[]).length,insurance:(data.insurance||[]).length,partners:(data.partners||[]).length};pageContent.innerHTML=`<div class="section-head"><div><div class="kicker">ALSITEEN MEDICAL CMS</div><h2>${tr('إدارة محتوى الموقع','Website Content Management')}</h2><p>${tr('إدارة بيانات الموقع من مكان واحد مع الحفظ المباشر في Google Sheets.','Manage website content in one place with direct Google Sheets sync.')}</p></div></div><div class="cards"><div class="stat"><div class="l">${tr('الأقسام والتخصصات','Departments')}</div><div class="n">${counts.departments}</div></div><div class="stat"><div class="l">${tr('الأجهزة الطبية','Medical devices')}</div><div class="n">${counts.devices}</div></div><div class="stat"><div class="l">${tr('شركات التأمين','Insurance companies')}</div><div class="n">${counts.insurance}</div></div><div class="stat"><div class="l">${tr('الموردون وسابقة الأعمال','Partners & suppliers')}</div><div class="n">${counts.partners}</div></div></div><div class="panel"><div class="panel-head"><h3>${tr('اختصارات الإدارة','Quick actions')}</h3></div><div class="panel-body"><div class="savebar" style="justify-content:flex-start;flex-wrap:wrap"><button class="primary" onclick="showSection('departments')">+ ${tr('إضافة/تعديل تخصص','Manage departments')}</button><button class="ghost" onclick="showSection('insurance')">${tr('إدارة التأمين','Manage insurance')}</button><button class="ghost" onclick="showSection('partners')">${tr('إدارة الموردين','Manage partners')}</button><button class="ghost" onclick="showSection('site')">${tr('إعدادات التواصل','Contact settings')}</button></div></div></div>`}
const configs={departments:{cols:['ar','en','desc_ar','desc_en','active'],name:['الأقسام والتخصصات','Departments'],search:'ar'},devices:{cols:['name','ar','en','active'],name:['الأجهزة الطبية','Medical Devices'],search:'name'},insurance:{cols:['name','active'],name:['شركات التأمين','Insurance Companies'],search:'name'},partners:{cols:['ar','en','logo','active'],name:['سابقة الأعمال والموردون','Partners & Suppliers'],search:'ar'},values:{cols:['icon','ar','en','ar_desc','en_desc'],name:['قيم المجمع','Medical Complex Values'],search:'ar'}};
const labels={ar:['الاسم بالعربية','Arabic name'],en:['الاسم بالإنجليزية','English name'],desc_ar:['الوصف بالعربية','Arabic description'],desc_en:['الوصف بالإنجليزية','English description'],active:['الحالة','Status'],name:['الاسم','Name'],logo:['رابط/مسار الشعار','Logo URL / path'],icon:['الرمز','Icon'],ar_desc:['الوصف بالعربية','Arabic description'],en_desc:['الوصف بالإنجليزية','English description']};
function label(k){return labels[k]?labels[k][ar()?0:1]:k}
function renderList(key){const c=configs[key],arr=data[key]||[];pageContent.innerHTML=`<div class="section-head"><div><div class="kicker">${key.toUpperCase()}</div><h2>${c.name[ar()?0:1]}</h2></div><button class="primary" onclick="openEditor('${key}',-1)">+ ${tr('إضافة جديد','Add New')}</button></div><div class="panel"><div class="panel-head"><h3>${tr('إدارة البيانات','Manage records')}</h3><div class="searchbar"><input id="listSearch" placeholder="${tr('بحث...','Search...')}" oninput="filterTable()"></div></div><div class="table-wrap"><table class="data-table"><thead><tr>${c.cols.slice(0,3).map(k=>`<th>${label(k)}</th>`).join('')}<th>${tr('الحالة','Status')}</th><th>${tr('إجراءات','Actions')}</th></tr></thead><tbody id="listBody">${arr.map((o,i)=>tableRow(key,o,i,c)).join('')}</tbody></table></div></div>`}
function cellText(o,k){if(k==='active')return String(o[k])==='false'?tr('غير فعال','Inactive'):tr('فعال','Active');return esc(o[k]||'')}
function tableRow(key,o,i,c){const first=c.cols.slice(0,3);const active=String(o.active??'true')!=='false';return `<tr data-search="${esc(String(o[c.search]||o.name||o.en||'').toLowerCase())}">${first.map(k=>`<td>${k==='logo'&&o[k]?`<img src="../${esc(o[k])}" style="width:54px;height:38px;object-fit:contain" onerror="this.style.display='none'">`:cellText(o,k)}</td>`).join('')}<td><span class="status-pill ${active?'':'off'}">${active?tr('فعال','Active'):tr('غير فعال','Inactive')}</span></td><td><div class="row-actions"><button class="mini" onclick="openEditor('${key}',${i})">${tr('تعديل','Edit')}</button><button class="mini red" onclick="deleteItem('${key}',${i})">${tr('حذف','Delete')}</button></div></td></tr>`}
function filterTable(){const q=(listSearch.value||'').trim().toLowerCase();document.querySelectorAll('#listBody tr').forEach(r=>r.style.display=!q||r.dataset.search.includes(q)?'':'none')}
function openEditor(key,index){const c=configs[key],obj=index>=0?{...(data[key][index]||{})}:{active:'true'};modalTitle.textContent=(index>=0?tr('تعديل','Edit '):tr('إضافة','Add '))+c.name[ar()?0:1];modalBody.innerHTML=`<div class="grid2">${c.cols.map(k=>fieldHtml(k,obj[k])).join('')}</div><div class="savebar"><button class="ghost" onclick="closeModal()">${tr('إلغاء','Cancel')}</button><button class="primary" onclick="commitEditor('${key}',${index})">${tr('حفظ','Save')}</button></div>`;modal.classList.remove('hidden')}
function fieldHtml(k,v){if(k==='active')return `<label class="field"><span>${label(k)}</span><select data-edit="${k}"><option value="true" ${String(v)!=='false'?'selected':''}>${tr('فعال','Active')}</option><option value="false" ${String(v)==='false'?'selected':''}>${tr('غير فعال','Inactive')}</option></select></label>`;if(k.includes('desc'))return `<label class="field"><span>${label(k)}</span><textarea data-edit="${k}">${esc(v||'')}</textarea></label>`;return `<label class="field"><span>${label(k)}</span><input data-edit="${k}" value="${esc(v||'')}"></label>`}
function commitEditor(key,index){const obj={};modalBody.querySelectorAll('[data-edit]').forEach(x=>obj[x.dataset.edit]=x.value);data[key]=data[key]||[];if(index>=0)data[key][index]=obj;else data[key].push(obj);closeModal();renderList(key);saveAll()}
function deleteItem(key,index){if(!confirm(tr('هل تريد حذف هذا العنصر؟','Delete this item?')))return;data[key].splice(index,1);renderList(key);saveAll()}
function closeModal(){modal.classList.add('hidden')}
function renderSite(){const s=data.site||{};pageContent.innerHTML=`<div class="section-head"><div><div class="kicker">SITE SETTINGS</div><h2>${tr('إعدادات التواصل والموقع','Contact & Site Settings')}</h2></div></div><div class="panel"><div class="panel-body"><div class="grid2"><label class="field"><span>WhatsApp</span><input data-site="whatsapp" value="${esc(s.whatsapp||'')}"></label><label class="field"><span>${tr('العنوان بالعربية','Arabic address')}</span><input data-site="address_ar" value="${esc(s.address_ar||'')}"></label><label class="field"><span>Address EN</span><input data-site="address_en" value="${esc(s.address_en||'')}"></label><label class="field"><span>Google Maps</span><input data-site="map_url" value="${esc(s.map_url||'')}"></label><label class="field" style="grid-column:1/-1"><span>${tr('رابط Embed للخريطة','Map Embed URL')}</span><input data-site="map_embed" value="${esc(s.map_embed||'')}"></label></div><div class="savebar"><button class="primary" onclick="saveSite()">${tr('حفظ إعدادات التواصل','Save Settings')}</button></div></div></div>`}
function saveSite(){data.site=data.site||{};document.querySelectorAll('[data-site]').forEach(x=>data.site[x.dataset.site]=x.value);saveAll()}
function renderSecurity(){pageContent.innerHTML=`<div class="section-head"><div><div class="kicker">SECURITY</div><h2>${tr('تغيير كلمة المرور','Change Password')}</h2></div></div><div class="panel"><div class="panel-body" style="max-width:650px"><label class="field"><span>${tr('كلمة المرور الحالية','Current password')}</span><input id="currentPass" type="password"></label><label class="field"><span>${tr('كلمة المرور الجديدة','New password')}</span><input id="newPass" type="password"></label><label class="field"><span>${tr('تأكيد كلمة المرور الجديدة','Confirm new password')}</span><input id="confirmPass" type="password"></label><div class="savebar"><button class="primary" onclick="changePassword()">${tr('تغيير كلمة المرور','Change Password')}</button></div></div></div>`}
async function changePassword(){if(newPass.value.length<8)return toastMsg(tr('كلمة المرور الجديدة يجب أن تكون 8 أحرف على الأقل','New password must be at least 8 characters'),true);if(newPass.value!==confirmPass.value)return toastMsg(tr('تأكيد كلمة المرور غير متطابق','Passwords do not match'),true);try{const r=await post({action:'changePassword',token,currentPassword:currentPass.value,newPassword:newPass.value});if(r.ok){toastMsg(tr('تم تغيير كلمة المرور','Password changed'));currentPass.value=newPass.value=confirmPass.value=''}else toastMsg(r.error||tr('تعذر تغيير كلمة المرور','Could not change password'),true)}catch(e){toastMsg(tr('تعذر الاتصال بالخدمة','Service connection failed'),true)}}
async function saveAll(){try{const r=await post({action:'save',token,payload:JSON.stringify(data)});if(r.ok)toastMsg(tr('تم الحفظ بنجاح','Saved successfully'));else toastMsg(r.error||tr('تعذر الحفظ','Save failed'),true)}catch(e){toastMsg(tr('تعذر حفظ التعديلات','Could not save changes'),true)}}
password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});captchaInput.addEventListener('keydown',e=>{if(e.key==='Enter')login()});makeCaptcha();applyLang();
</script>
</body>
</html>
